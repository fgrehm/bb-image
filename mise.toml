[settings]
# Non-interactive by design: the image build and first-use installs must never prompt.
yes = true
jobs = 4

[tools]

# Installed at image build time. This is all bb itself needs to run.
#
# NOTE: node's version is duplicated as NODE_VERSION in the Containerfile, and the
# two have to stay in sync. The layer that installs node sits above the COPY of
# this file, because a layer cannot both install node and depend on the file that
# declares it. That separation is what stops a toolset edit from re-downloading
# node and reinstalling bb. The build asserts the versions match and fails with a
# readable error if they drift, so bump both together.
node = "24.21.0"

# Also installed at image build time. Small, used constantly, and the toolchain is not
# volume-backed, so anything lazy here would be re-fetched in every fresh container.
#
# The trade is that these land in the layer at and below `COPY mise.toml`, so editing
# the toolset re-downloads them. node, bb and Playwright's Chromium sit above that COPY
# and stay cached. mise's neovim declares bins = ["nvim"], which is what lets the
# container alias vi and vim to it without shadowing a shim.
#
# ripgrep installs an `rg` shim and no `ripgrep` command. tmux comes from
# aqua:tmux/tmux-builds, which is prebuilt; the asdf fallback backend compiles it.
neovim     = "0.12.5"
ripgrep    = "15.2.0"
jq         = "1.8.2"
shfmt      = "3.14.1"
git-lfs    = "3.8.0"
fd         = "10.5.0"
tmux       = "3.7c"
shellcheck = "0.11.0"

# First use only. Bootstrap shims are created at build time and install
# these on first invocation.
ruby = { version = "4.0.6", lazy = true }
bun = { version = "1.4.2", lazy = true }
go = { version = "1.27.1", lazy = true }
rust = { version = "1.98.1", lazy = true }
python = { version = "3.14.7", lazy = true }
gh = { version = "2.100.0", lazy = true }

# Pre-commit hooks. Deliberately unpinned.
prek = { version = "latest", lazy = true }

# Coding agent CLIs. Deliberately unpinned: `latest` resolves when the shim
# first runs, so a fresh container pulls the current release rather than a stale
# bake. bb dispatches to whichever of these you have authenticated.
claude   = { version = "latest", lazy = true }
codex    = { version = "latest", lazy = true }
pi       = { version = "latest", lazy = true }
opencode = { version = "latest", lazy = true }
grok     = { version = "latest", lazy = true }
oh-my-pi = { version = "latest", lazy = true }

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
	bb-image fontconfig.

	Debian's /etc/fonts/fonts.conf with the system cache directories dropped, so
	fontconfig never attempts a write outside the xdg cache. fontconfig can add
	cache directories but never prune one, so the list cannot be trimmed by
	including the distro file; replacing the file is the only way to drop
	/var/cache/fontconfig and ~/.fontconfig.

	Removing them removes the chmod("/var/cache/fontconfig", 0755) that
	FcDirCacheWrite attempts, which is what a sandboxed agent sees as
	"Write blocked: /var/cache/fontconfig" on every browser launch. What is left
	is $XDG_CACHE_HOME/fontconfig, inside the home volume, which is where a cache
	belongs.

	Everything below is Debian's file; only the description, the conf.d include
	path and the cache directory list differ. The guard in the Containerfile
	compares the two and fails the build when a font package bump drifts the
	distro file.
-->
<fontconfig>
	<description>bb-image fontconfig (xdg cache only)</description>

<!--
	Generated from Debian's /etc/fonts/fonts.conf for the bb-image base image.
	Regenerate it rather than editing it by hand; see AGENTS.md.

	Matching rules that are genuinely local still belong in 'local.conf', which
	the conf.d include below picks up.
-->

<!-- Font directory list -->

	<dir>/usr/share/fonts</dir>
	<dir>/usr/local/share/fonts</dir>
	<dir prefix="xdg">fonts</dir>
	<!-- the following element will be removed in the future -->
	<dir>~/.fonts</dir>

<!--
  Accept deprecated 'mono' alias, replacing it with 'monospace'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>mono</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>monospace</string>
		</edit>
	</match>

<!--
  Accept alternate 'sans serif' spelling, replacing it with 'sans-serif'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>sans serif</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>sans-serif</string>
		</edit>
	</match>

<!--
  Accept deprecated 'sans' alias, replacing it with 'sans-serif'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>sans</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>sans-serif</string>
		</edit>
	</match>
<!--
  Accept alternate 'system ui' spelling, replacing it with 'system-ui'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>system ui</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>system-ui</string>
		</edit>
	</match>

<!--
  Ignore dpkg temporary files created in fonts directories
-->
	<selectfont>
		<rejectfont>
			<glob>*.dpkg-tmp</glob>
		</rejectfont>
	</selectfont>
	<selectfont>
		<rejectfont>
			<glob>*.dpkg-new</glob>
		</rejectfont>
	</selectfont>

<!--
  Load local system customization file
-->
	<include ignore_missing="yes">/etc/fonts/conf.d</include>

<!--
	The one and only cache directory. Naming it explicitly matters: a config with
	no <cachedir> at all makes fontconfig re-add /var/cache/fontconfig from its
	compiled-in defaults, and warn about having done so.
-->
	<cachedir prefix="xdg">fontconfig</cachedir>

	<config>
<!--
  Rescan configuration every 30 seconds when FcFontSetList is called
 -->
		<rescan>
			<int>30</int>
		</rescan>
	</config>

</fontconfig>

name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Publishes ghcr.io/fgrehm/bb. Deliberately not github.repository, since the
  # repo is named bb-image but the image is bb.
  IMAGE_NAME: ${{ github.repository_owner }}/bb
  # linux/arm64 is deferred, not ruled out. node-pty and better-sqlite3 fall back
  # to node-gyp when no prebuild matches, and node-gyp needs python3 at build
  # time, which the image does not carry at that stage. Adding arm64 here also
  # means adding a docker/setup-qemu-action step; emulation is the only reason
  # that step exists, and it is dead weight while the platform list stays native.
  PLATFORMS: linux/amd64

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      # Full history and tags: the release step reads the previous release's bb
      # version out of the Containerfile at the last tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two version axes: the bb release baked into the image, read from the
      # Containerfile so the tag can never disagree with what is inside, and the
      # image's own version, taken from the git tag. The second axis is what
      # gives somewhere to publish an image-only change, such as a node bump or
      # a base digest refresh, that has no bb release to hang a tag on.
      - name: Resolve versions
        shell: bash
        run: |
          set -euo pipefail
          read_arg() { sed -n "s/^ARG $1=\(.*\)/\1/p" Containerfile; }

          bb="$(read_arg BB_VERSION)"
          if [ -z "$bb" ]; then
            echo "could not read BB_VERSION from the Containerfile" >&2
            exit 1
          fi

          {
            echo "BB_VERSION=$bb"
            echo "BB_MINOR=${bb%.*}"
            echo "IMAGE_VERSION=${GITHUB_REF_NAME#v}"
            echo "NODE_VERSION=$(read_arg NODE_VERSION)"
            echo "MISE_VERSION=$(read_arg MISE_VERSION)"
          } >> "$GITHUB_ENV"

          echo "bb ${bb}, image ${GITHUB_REF_NAME#v}"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            # Image pin: every tag, prereleases included.
            type=raw,value=img-${{ env.IMAGE_VERSION }},enable=${{ github.ref_type == 'tag' }}
            # bb aliases and latest: stable tags only. A prerelease must not move
            # the aliases people pin, or an rc would silently become "latest".
            type=raw,value=${{ env.BB_VERSION }},enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ env.BB_MINOR }},enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Not Dockerfile. buildx does not auto-detect Containerfile the way
          # podman does, so this has to be set explicitly.
          file: Containerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BB_VERSION=${{ env.BB_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # States the bb move explicitly, since that is what users actually care
      # about and a git tag cannot express it. Re-runs leave an existing release
      # alone rather than failing.
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          tag="v${IMAGE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} already exists, leaving it alone"
            exit 0
          fi

          prev="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | grep -v -- '-' | head -n1 || true)"
          prev_bb=""
          if [ -n "$prev" ]; then
            prev_bb="$(git show "${prev}:Containerfile" | sed -n 's/^ARG BB_VERSION=\(.*\)/\1/p')"
          fi

          if [ -z "$prev_bb" ]; then
            bb_line="bb ${BB_VERSION}"
          elif [ "$prev_bb" = "$BB_VERSION" ]; then
            bb_line="bb ${BB_VERSION} (unchanged since ${prev})"
          else
            bb_line="bb ${prev_bb} -> ${BB_VERSION}"
          fi

          notes="$(printf '%s\n' \
            "$bb_line" \
            "image ${IMAGE_VERSION}" \
            "" \
            "node ${NODE_VERSION}, mise ${MISE_VERSION}" \
            "" \
            "published:" \
            $(printf '  %s\n' $PUBLISHED))"

          if [ "${IMAGE_VERSION}" != "${IMAGE_VERSION%-*}" ]; then
            gh release create "$tag" --prerelease \
              --title "${tag} (bb ${BB_VERSION})" --notes "$notes"
          else
            gh release create "$tag" \
              --title "${tag} (bb ${BB_VERSION})" --notes "$notes"
          fi

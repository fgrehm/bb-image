name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A docs-only change needs no image build. This is safe for releases because GitHub
    # does not evaluate path filters for tag pushes, so a v* tag always builds even when
    # the commit it points at only touched markdown. workflow_dispatch is unfiltered for
    # the same reason: a manual run is an explicit request to build.
    #
    # Anything not listed here still builds, including the Makefile and this file, since
    # those change how the image is run rather than only documenting it.
    paths-ignore:
      - "**/*.md"
      - "examples/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Publishes ghcr.io/fgrehm/bb. Deliberately not github.repository, since the
  # repo is named bb-image but the image is bb.
  IMAGE_NAME: ${{ github.repository_owner }}/bb
  # linux/arm64 is deferred, not ruled out. node-pty and better-sqlite3 fall back
  # to node-gyp when no prebuild matches, and node-gyp needs python3 at build
  # time, which the image does not carry at that stage. Adding arm64 here also
  # means adding a docker/setup-qemu-action step; emulation is the only reason
  # that step exists, and it is dead weight while the platform list stays native.
  PLATFORMS: linux/amd64
  # Host gate for the VM flavor. The archive and its checksum are fetched from
  # the matching upstream release rather than piping an installer into CI.
  SMOLVM_VERSION: 1.18.2
  # Flavor names, tag suffixes, and host gates come from container/flavors.tsv.

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        shell: bash
        run: |
          set -euo pipefail
          printf 'include=%s\n' "$(sh build/manifest.sh matrix)" >> "$GITHUB_OUTPUT"

  publish:
    needs: [matrix]
    runs-on: ubuntu-24.04
    strategy:
      # A variant that fails blocks the release: do not publish full while a
      # variant someone depends on failed its own verification.
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.include) }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      # Full history and tags: the release job reads the previous release's bb
      # version out of the Containerfile at the last tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two version axes: the bb release baked into the image, read from the
      # Containerfile so the tag can never disagree with what is inside, and the
      # image's own version, taken from the git tag. The second axis is what
      # gives somewhere to publish an image-only change, such as a node bump or
      # a base digest refresh, that has no bb release to hang a tag on.
      - name: Resolve versions
        shell: bash
        run: |
          set -euo pipefail
          read_arg() { sed -n "s/^ARG $1=\(.*\)/\1/p" container/Containerfile.foundation; }

          bb="$(read_arg BB_VERSION)"
          if [ -z "$bb" ]; then
            echo "could not read BB_VERSION from the Containerfile" >&2
            exit 1
          fi

          {
            echo "BB_VERSION=$bb"
            echo "BB_MINOR=${bb%.*}"
            echo "IMAGE_VERSION=${GITHUB_REF_NAME#v}"
            echo "BB_NODE_VERSION=$(read_arg BB_NODE_VERSION)"
            echo "MISE_VERSION=$(read_arg MISE_VERSION)"
            echo "PLAYWRIGHT_VERSION=$(read_arg PLAYWRIGHT_VERSION)"
          } >> "$GITHUB_ENV"

          echo "bb ${bb}, image ${GITHUB_REF_NAME#v}, flavor ${{ matrix.flavor }}"

      # Tags carry the variant suffix from matrix data; see the comment on the
      # matrix above. Full keeps the unsuffixed tags it has always had
      # (including `latest`), and the bare `slim` alias mirrors `latest` for
      # people who run the smaller image with the same unpinned habit; full is
      # the only image behind `latest` itself. A prerelease moves none of the
      # aliases.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # ref==main rather than event==push: a manual dispatch defaults to
            # main, and a dispatch run is as much a publish as a push is; with
            # event_name in the condition it would build and push with no tags
            # at all.
            type=raw,value=edge${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/main' }}
            # Image pin: every tag, prereleases included.
            type=raw,value=img-${{ env.IMAGE_VERSION }}${{ matrix.suffix }},enable=${{ github.ref_type == 'tag' }}
            # bb aliases, latest, and the bare slim alias: stable tags only. A
            # prerelease must not move the aliases people pin, or an rc would
            # silently become "latest".
            type=raw,value=${{ env.BB_VERSION }}${{ matrix.suffix }},enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ env.BB_MINOR }}${{ matrix.suffix }},enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && matrix.flavor == 'full' && !contains(github.ref_name, '-') }}
            type=raw,value=slim,enable=${{ github.ref_type == 'tag' && matrix.flavor == 'slim' && !contains(github.ref_name, '-') }}

      # Generate targets from the same graph as the matrix.
      - name: Generate Bake file
        run: sh build/manifest.sh bake > docker-bake.generated.hcl

      # Bake gives each Containerfile its parent as a named target context.
      # Only the selected flavor is loaded or pushed; internal parents stay in
      # the builder. Keep tags and labels in one override file for both passes.
      - name: Prepare Bake metadata
        shell: bash
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          jq --arg flavor '${{ matrix.flavor }}' \
            '{target: {($flavor): {tags: .tags, labels: .labels}}}' \
            <<< "$META_JSON" > docker-bake.meta.json

      - name: Build image
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.generated.hcl
            ./docker-bake.meta.json
          targets: ${{ matrix.flavor }}
          set: |
            ${{ matrix.flavor }}.tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staged-${{ matrix.flavor }}
            ${{ matrix.flavor }}.output=type=docker
            *.platform=${{ env.PLATFORMS }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Everything verification-shaped lives here: the Containerfile has no
      # assertion RUNs any more. build/check.sh runs the flavor-matching
      # behavioral checks (launch smoke, fontconfig drift and parity, first-use
      # installs, token leak, home size) against the image that just built, and
      # refuses an image whose sh.bb.flavor marker disagrees — a slim build
      # cannot pass because it was verified as full. Runs before the push step
      # below, so nothing ships while these fail. Runs on main too: :edge is a
      # publish just the same, and the checks are the only place fontconfig
      # drift can still be caught.
      - name: Verify image
        # Runs against the staged image from the build step, in docker (the
        # runner's engine; podman is not preinstalled there).
        run: make check ENGINE=docker
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: staged-${{ matrix.flavor }}
          FLAVOR: ${{ matrix.flavor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache smolvm
        if: matrix.smolvm
        id: smolvm-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bb-image/smolvm-${{ env.SMOLVM_VERSION }}
          key: smolvm-${{ runner.os }}-${{ runner.arch }}-${{ env.SMOLVM_VERSION }}

      - name: Install smolvm for VM gate
        if: matrix.smolvm && steps.smolvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          asset="smolvm-${SMOLVM_VERSION}-linux-x86_64.tar.gz"
          base="https://github.com/smol-machines/smolvm/releases/download/v${SMOLVM_VERSION}"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/checksums.sha256"
          grep "  ${asset}$" checksums.sha256 | sha256sum -c -
          mkdir -p "$HOME/.cache/bb-image/smolvm-${SMOLVM_VERSION}"
          tar -xzf "$asset" --strip-components=1 \
            -C "$HOME/.cache/bb-image/smolvm-${SMOLVM_VERSION}"

      - name: Prepare smolvm host
        if: matrix.smolvm
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo "GitHub runner has no KVM device" >&2; exit 1; }
          sudo chmod 0666 /dev/kvm
          echo "$HOME/.cache/bb-image/smolvm-${SMOLVM_VERSION}" >> "$GITHUB_PATH"

      - name: Verify VM boot contract
        if: matrix.boot
        run: make check-smolvm-systemd ENGINE=docker
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: staged-${{ matrix.flavor }}
          FLAVOR: ${{ matrix.flavor }}

      - name: Verify rootless Podman CLI
        if: matrix.smolvm
        run: make check-smolvm-podman ENGINE=docker
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: staged-${{ matrix.flavor }}
          FLAVOR: ${{ matrix.flavor }}

      # The second build re-verifies and pushes. Both builds share the same
      # context, file, target, platforms, build-args, secrets AND labels, so an
      # ordinary cache hit reuses the exact filesystem layers that were
      # verified; the verified filesystem is what ships. The push build
      # additionally produces provenance and sbom attestations (which wrap
      # manifest structure, not layer bytes), so a literal artifact-identity
      # guarantee would need that step to become a push of the staged artifact
      # instead of a rebuild. A mid-run GHA cache eviction would re-execute
      # RUNs and is the residual risk the cache argument carries; the
      # unpinned `latest` tools are lazy, so they install nothing at build
      # time and cannot diverge.

      # A workflow_dispatch on a feature branch is build-and-verify only. The
      # metadata tag rules are intentionally limited to main and release tags.
      - name: Build and push
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.generated.hcl
            ./docker-bake.meta.json
          targets: ${{ matrix.flavor }}
          set: |
            ${{ matrix.flavor }}.output=type=registry
            *.platform=${{ env.PLATFORMS }}
            *.cache-from=type=gha
          provenance: true
          sbom: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # States the bb move explicitly, since that is what users actually care
  # about and a git tag cannot express it. Depends on every publish job, so no
  # release notes appear while a variant is missing or failed. Re-runs leave
  # an existing release alone rather than failing.
  release:
    if: github.ref_type == 'tag'
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve versions
        shell: bash
        run: |
          set -euo pipefail
          bb="$(sed -n 's/^ARG BB_VERSION=\(.*\)/\1/p' container/Containerfile.foundation)"
          [ -n "$bb" ] || { echo "could not read BB_VERSION from the Containerfile" >&2; exit 1; }
          {
            echo "BB_VERSION=$bb"
            echo "IMAGE_VERSION=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_ENV"

      - name: List published tags
        id: published
        shell: bash
        run: |
          set -euo pipefail
          # The set of tags another variant deduplicates, mirroring the
          # metadata-action rules above. A stable tag also feeds the aliases;
          # a prerelease gets an image pin and variant pins only.
          stable=true
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then stable=false; fi
          {
            while IFS=$'\t' read -r flavor parent published suffix smolvm boot; do
              [[ "$flavor" =~ ^#|^$ ]] && continue
              [ "$published" = yes ] || continue
              [ "$suffix" = - ] && suffix=""
              echo "img-${IMAGE_VERSION}${suffix}"
              # bb aliases, latest, slim: stable tags only. full is unsuffixed.
              if $stable; then
                echo "${BB_VERSION}${suffix}"
                echo "${BB_VERSION%.*}${suffix}"
                if [ "$flavor" = full ]; then echo "latest"; fi
                if [ "$flavor" = slim ]; then echo "slim"; fi
              fi
            done < container/flavors.tsv
          } | sort -u | grep -v '^$' > /tmp/names.txt

          # If any single job failed the release job never starts, but a main
          # push that produced no tag must not fail this script either: on
          # a prerelease, the aliases are simply absent.
          {
            echo "tags<<EOF"
            sed "s|^|${REGISTRY}/${IMAGE_NAME}:|" /tmp/names.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.published.outputs.tags }}
        run: |
          set -euo pipefail

          tag="v${IMAGE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} already exists, leaving it alone"
            exit 0
          fi

          prev="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | grep -v -- '-' | head -n1 || true)"
          prev_bb=""
          if [ -n "$prev" ]; then
            # Earlier releases used one container/Containerfile, and the oldest
            # ones kept it at the repository root. Read the first path present.
            prev_bb="$({ git show "${prev}:container/Containerfile.foundation" 2>/dev/null \
                  || git show "${prev}:container/Containerfile" 2>/dev/null \
                  || git show "${prev}:Containerfile"; } \
                  | sed -n 's/^ARG BB_VERSION=\\(.*\\)/\\1/p')"
          fi

          if [ -z "$prev_bb" ]; then
            bb_line="bb ${BB_VERSION}"
          elif [ "$prev_bb" = "$BB_VERSION" ]; then
            bb_line="bb ${BB_VERSION} (unchanged since ${prev})"
          else
            bb_line="bb ${prev_bb} -> ${BB_VERSION}"
          fi

          {
            printf '%s\n' "$bb_line"
            printf 'image %s\n' "$IMAGE_VERSION"
            printf '\n'
            printf '%s\n' "published:"
            while IFS= read -r t; do printf '  %s\n' "$t"; done <<<"$TAGS"
          } > /tmp/notes.txt

          if [ "${IMAGE_VERSION}" != "${IMAGE_VERSION%-*}" ]; then
            gh release create "$tag" --prerelease \
              --title "${tag} (bb ${BB_VERSION})" --notes-file /tmp/notes.txt
          else
            gh release create "$tag" \
              --title "${tag} (bb ${BB_VERSION})" --notes-file /tmp/notes.txt
          fi

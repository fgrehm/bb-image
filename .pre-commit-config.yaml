# Runs on every commit (and on CI) via prek / pre-commit. shellcheck and shfmt
# are also enforced by the built image's own make check (which lints using the
# tools baked inside the image); these hooks are for iterations in between, so a
# push never lands with a script that make check would have to refuse.
repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]
        files: \.sh$
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1
    hooks:
      - id: shfmt
        args: ["-d"]
        files: \.sh$

# Runs on every commit via prek / pre-commit. CI enforces the same shellcheck and
# shfmt checks through the built image's make check; these hooks are for local
# iterations, so a push never lands with a script that make check would refuse.
repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]
        files: \.sh$
  - repo: local
    hooks:
      # gitleaks, from the mise toolset in this repo, so it installs (or resolves)
      # on first run. CI reruns the same scan, over the full history, inside the
      # image's make check.
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact
        language: system
        pass_filenames: false
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: ["-d"]
        files: \.sh$
